<style>
:root{
  /* Direction: an OMR answer sheet. Pink drop-out print on cool paper, graphite pencil fills, single-column form rows. */
  --paper:#f2f3f1;
  --sheet:#ffffff;
  --ink:#1f2226;
  --muted:#5f646a;
  --print:#c9475e;
  --print-soft:#f8e3e7;
  --line:#e8cbd1;
  --lead:#27292d;
  --lead-ink:#ffffff;
  --good:#1d6e44;
  --good-soft:#e1f1e7;
  --bad:#b02a20;
  --bad-soft:#fbe6e3;
  --f-form:"Barlow Condensed","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-en:"Source Serif 4",Georgia,"PingFang TC","Noto Sans TC","Microsoft JhengHei",serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131518;--sheet:#1b1e22;--ink:#ebe9e4;--muted:#a3a8ae;
    --print:#f08a9b;--print-soft:#3a2329;--line:#4b3137;
    --lead:#ebe9e4;--lead-ink:#131518;
    --good:#72d09b;--good-soft:#17342a;--bad:#ff9086;--bad-soft:#3d1d1a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131518;--sheet:#1b1e22;--ink:#ebe9e4;--muted:#a3a8ae;
  --print:#f08a9b;--print-soft:#3a2329;--line:#4b3137;
  --lead:#ebe9e4;--lead-ink:#131518;
  --good:#72d09b;--good-soft:#17342a;--bad:#ff9086;--bad-soft:#3d1d1a;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.65 var(--f-ui)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--print);outline-offset:2px}
.wrap{max-width:42.5rem;margin:0 auto;padding:1.25rem 1rem 1.5rem;display:flex;flex-direction:column;gap:1rem}
.foot{max-width:42.5rem;margin:0 auto;padding:0.5rem 1rem 3rem;color:var(--muted);font-size:0.8125rem;line-height:1.6;text-align:center}
.foot p{margin:0}
.home-main,.home-side{display:flex;flex-direction:column;gap:1rem;min-width:0}

/* Language and appearance switches, top right of every view */
.prefs{display:flex;justify-content:flex-end;gap:0.5rem;flex-wrap:wrap}
.seg{display:inline-flex;padding:2px;border:1px solid var(--line);border-radius:999px;background:var(--sheet)}
.seg button{border:0;background:none;border-radius:999px;min-height:1.875rem;padding:0.25rem 0.75rem;font:600 0.8125rem/1.2 var(--f-ui);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--lead);color:var(--lead-ink)}
.seg button[aria-pressed="false"]:hover{color:var(--ink)}

/* Exam countdown (the date stays in this browser) */
.exam-form{display:flex;flex-wrap:wrap;gap:0.75rem;align-items:flex-end;padding:0.75rem 1rem 0.875rem}
.exam-form label{display:flex;flex-direction:column;gap:0.25rem;font-size:0.8125rem;color:var(--muted)}
.exam-form input{font:500 1rem/1.2 var(--f-num);color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:0.375rem;padding:0.5rem 0.625rem;min-height:2.75rem}
.exam-btns{display:flex;gap:0.5rem;flex-wrap:wrap}
.exam-form .btn{padding:0.6875rem 1.25rem}
.exam-now{display:flex;align-items:center;gap:0.5rem 1rem;flex-wrap:wrap;padding:0.75rem 1rem 0.875rem}
.exam-big{display:flex;align-items:baseline;gap:0.25rem;color:var(--print);font-weight:600}
.exam-big b{font:700 2.875rem/1 var(--f-form);letter-spacing:.02em}
.exam-big span{font-size:0.9375rem}
.exam-now p{margin:0;flex:1;min-width:9.375rem;font-size:0.9375rem;line-height:1.5}
.exam-now .exam-btns{margin-left:auto}
.kbd{display:none;margin:0;font-size:0.8125rem;color:var(--muted)}
.kbd kbd{font:600 0.75rem/1 var(--f-num);border:1px solid var(--line);border-bottom-width:2px;border-radius:0.25rem;padding:2px 0.375rem;margin:0 2px;background:var(--sheet);color:var(--ink)}
.qnav + .kbd{text-align:right;margin-top:-0.375rem}
.kbd-c{text-align:center}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:0.375rem;overflow:hidden}
.sec-head{font-family:var(--f-form);font-weight:600;letter-spacing:.08em;font-size:0.9375rem;color:var(--print);padding:0.625rem 1rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:0.75rem;text-transform:uppercase}
.sec-head small{font-family:var(--f-ui);font-weight:400;letter-spacing:0;color:var(--muted);font-size:0.8125rem;text-transform:none}

/* Masthead */
.mast-band{display:flex;justify-content:space-between;gap:0.75rem;background:var(--print);color:var(--sheet);font-family:var(--f-form);font-weight:600;letter-spacing:.1em;font-size:0.875rem;padding:0.375rem 1rem}
.mast-body{padding:1.125rem 1rem 1rem}
.deco{display:flex;gap:0.375rem;margin-bottom:0.75rem}
.deco i{width:1.5rem;height:1.5rem;border:1.5px solid var(--print);border-radius:50%;display:grid;place-items:center;font:600 0.6875rem/1 var(--f-num);font-style:normal;color:var(--print)}
.deco i.on{animation:pencil .5s .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes pencil{from{background:transparent;color:var(--print);border-color:var(--print);transform:scale(.8)}60%{transform:scale(1.12)}to{background:var(--lead);color:var(--lead-ink);border-color:var(--lead);transform:scale(1)}}
.mast h1{margin:0;font-size:clamp(1.75rem,7.5vw,2.375rem);line-height:1.15;letter-spacing:.02em;text-wrap:balance}
.mast p{margin:0.375rem 0 0;color:var(--muted);font-size:0.9375rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.stat{padding:0.625rem 1rem;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat span{display:block;font-size:0.75rem;color:var(--print);letter-spacing:.04em}
.stat b{font-family:var(--f-num);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}

/* Mode rows */
.mode{display:grid;grid-template-columns:4.375rem 1fr auto;align-items:center;gap:0.75rem;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:0.875rem 1rem;cursor:pointer}
.mode:hover:not([disabled]){background:var(--print-soft)}
.mode.primary{background:var(--print-soft)}
.mode .tag{font-family:var(--f-form);font-weight:700;font-size:1rem;letter-spacing:.05em;color:var(--print);line-height:1.1}
.mode .tag small{display:block;font-family:var(--f-ui);font-weight:400;font-size:0.75rem;color:var(--muted);letter-spacing:0;margin-top:0.1875rem}
.mode b{display:block;font-size:1.0625rem;line-height:1.35}
.mode .desc{display:block;color:var(--muted);font-size:0.875rem;line-height:1.45;margin-top:2px}
.mode .go{font-family:var(--f-form);font-weight:600;color:var(--print);font-size:1rem;white-space:nowrap}
.mode[disabled]{cursor:default}
.mode[disabled] .tag,.mode[disabled] b,.mode[disabled] .go{opacity:.45}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0.75rem 1rem}
.opt-row p{margin:0;font-size:0.875rem;color:var(--muted);line-height:1.45}
.opt-row strong{display:block;color:var(--ink);font-size:1rem}
.switch{position:relative;display:inline-flex;cursor:pointer;flex:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:2.875rem;height:1.75rem;border-radius:0.875rem;background:var(--line);position:relative;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:0.1875rem;left:0.1875rem;width:1.375rem;height:1.375rem;border-radius:50%;background:var(--sheet);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked + .track{background:var(--print)}
.switch input:checked + .track::after{transform:translateX(1.125rem)}
.switch input:focus-visible + .track{outline:2px solid var(--print);outline-offset:2px}

/* Checklist + tips */
.check{list-style:none;margin:0;padding:0.375rem 0}
.check label{display:flex;align-items:center;gap:0.75rem;padding:0.5rem 1rem;cursor:pointer}
.check input{appearance:none;-webkit-appearance:none;width:1.375rem;height:1.375rem;border:1.5px solid var(--print);border-radius:50%;margin:0;flex:none;background:var(--sheet);cursor:pointer;transition:background .15s}
.check input:checked{background:var(--lead);border-color:var(--lead)}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.tips{margin:0;padding:0.75rem 1rem 0.875rem 2.5rem;display:flex;flex-direction:column;gap:0.5rem}
.tips li{padding-left:0.25rem}
.tips li::marker{font-family:var(--f-num);color:var(--print);font-weight:600}
.tips b{color:var(--ink)}

/* Quiz */
.qtop{display:flex;align-items:center;gap:0.75rem}
.btn-ghost{background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:0.375rem 0.875rem;font-size:0.875rem;cursor:pointer;white-space:nowrap}
.btn-ghost:hover{border-color:var(--print)}
.qtitle{font-family:var(--f-form);font-weight:600;letter-spacing:.06em;color:var(--print);flex:1;min-width:0;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qcount{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:0.9375rem;white-space:nowrap}
.qcount .tl{color:var(--print);margin-right:0.5rem}
.strip{display:flex;flex-wrap:wrap;gap:0.375rem}
.strip i{width:1.625rem;height:1.625rem;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 0.6875rem/1 var(--f-num);font-style:normal;color:var(--muted);background:var(--sheet)}
.strip i.cur{border-color:var(--print);color:var(--print);box-shadow:0 0 0 0.1875rem var(--print-soft)}
.strip i.ok{background:var(--good);border-color:var(--good);color:var(--sheet)}
.strip i.ng{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.timer{height:0.375rem;background:var(--line);border-radius:0.1875rem;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--print);transition:width .25s linear}
.timer i.low{background:var(--bad)}
.qcard{padding:1rem}
.passage{border:1px solid var(--line);border-radius:0.25rem;margin-bottom:1.125rem;background:var(--paper)}
.passage summary{font-family:var(--f-form);font-weight:600;letter-spacing:.05em;color:var(--print);padding:0.5rem 0.75rem;cursor:pointer;font-size:0.9375rem}
.ptext{padding:2px 0.875rem 0.875rem;font-family:var(--f-en);font-size:1rem;line-height:1.7}
.ptext p{margin:0 0 0.625rem}
.ptext p:last-child{margin-bottom:0}
.phead{font-family:var(--f-num);font-size:0.8125rem;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:0.5rem;margin-bottom:0.625rem;line-height:1.6}
.pb{display:inline-block;min-width:3.2em;padding:0 0.375rem;border-bottom:2px solid var(--muted);font:600 0.8125rem/1.5 var(--f-num);color:var(--muted);text-align:center}
.pb.cur{background:var(--print-soft);border-color:var(--print);color:var(--print)}
.pb.done{min-width:0;font:600 1em/1.5 var(--f-en);color:var(--good);border-color:var(--good);text-align:left}
.pb.ins{display:inline;border-bottom-style:dashed}
.chat{display:flex;flex-direction:column;gap:0.5rem;padding-top:0.375rem}
.msg{max-width:88%;background:var(--sheet);border:1px solid var(--line);border-radius:0.625rem 0.625rem 0.625rem 2px;padding:0.375rem 0.625rem}
.msg.me{align-self:flex-end;border-radius:0.625rem 0.625rem 2px 0.625rem;background:var(--print-soft)}
.msg p{margin:2px 0 0}
.who{font:600 0.75rem/1.4 var(--f-ui);color:var(--muted)}
.who span{font-weight:500;font-family:var(--f-num);margin-left:0.375rem}
.notice h4{font-size:1.125rem;margin:0.375rem 0 0.5rem;line-height:1.35;text-align:center}
.notice ul{margin:0 0 0.625rem;padding-left:1.25rem;display:flex;flex-direction:column;gap:0.375rem}
.qnum{font-family:var(--f-num);font-size:0.8125rem;color:var(--muted);margin-bottom:0.375rem;display:flex;gap:0.625rem;align-items:center}
.qnum .ptag{color:var(--print)}
.prompt{font-family:var(--f-en);font-size:1.1875rem;line-height:1.55;margin:0 0 1rem;text-wrap:pretty}
.prompt .inst{font-family:var(--f-ui);font-size:1rem;color:var(--muted)}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);text-align:center;padding:0 0.25rem;line-height:1.25}
.blank.done{color:var(--good);border-color:var(--good);font-weight:600}
.audio{display:flex;flex-wrap:wrap;gap:0.625rem;align-items:center;margin-bottom:0.75rem}
.play{display:inline-flex;align-items:center;gap:0.5rem;background:var(--print);color:var(--sheet);border:0;border-radius:999px;padding:0.625rem 1.125rem;font-weight:600;cursor:pointer}
.play svg{width:1rem;height:1rem;fill:currentColor}
.play.on{opacity:.7}
.note{font-size:0.875rem;color:var(--muted);margin:0 0 0.75rem}
.transcript{font-family:var(--f-en);background:var(--paper);border-radius:0.25rem;padding:0.625rem 0.75rem;margin:0 0 0.875rem;font-size:1rem}
.opts{display:flex;flex-direction:column;gap:0.5rem}
.opt{display:grid;grid-template-columns:2rem 1fr auto;align-items:center;gap:0.75rem;width:100%;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:0.375rem;padding:0.625rem 0.75rem;cursor:pointer;font-family:var(--f-en);font-size:1.0625rem;line-height:1.4;min-height:3.375rem}
button.opt:hover{border-color:var(--print)}
div.opt{cursor:default}
.opt .hid{font-family:var(--f-ui);font-size:0.9375rem;color:var(--muted)}
.bub{width:1.875rem;height:1.875rem;border-radius:50%;border:1.5px solid var(--print);display:grid;place-items:center;font:600 0.875rem/1 var(--f-num);color:var(--print)}
.opt.picked .bub{background:var(--lead);border-color:var(--lead);color:var(--lead-ink)}
.opt.picked.anim .bub{animation:fill .32s cubic-bezier(.2,.8,.2,1)}
@keyframes fill{0%{transform:scale(.7);background:transparent;color:var(--print)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .mk{font:600 0.8125rem/1.2 var(--f-ui);white-space:nowrap}
.opt.right .mk{color:var(--good)}
.opt.wrong .mk{color:var(--bad)}
.explain{margin-top:1rem;border-top:1px dashed var(--line);padding-top:0.875rem}
.verdict{font-weight:700;font-size:1.0625rem;display:flex;align-items:baseline;gap:0.625rem;flex-wrap:wrap}
.verdict.ok{color:var(--good)}
.verdict.ng{color:var(--bad)}
.verdict .ans{font:500 0.875rem/1 var(--f-num);color:var(--muted)}
.explain p{margin:0.5rem 0 0}
.explain .zh{color:var(--muted);font-size:0.9375rem}
.qnav{display:flex;gap:0.625rem;justify-content:flex-end;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--ink);border-radius:999px;padding:0.75rem 1.375rem;font-weight:600;font-size:1rem;cursor:pointer;background:var(--ink);color:var(--sheet)}
.btn.alt{background:var(--sheet);color:var(--ink);border-color:var(--line)}
.btn.alt:hover{border-color:var(--print)}

/* Results */
.score{padding:1.25rem 1rem;display:flex;align-items:flex-end;gap:1.125rem;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.big{font:600 3.5rem/1 var(--f-num);font-variant-numeric:tabular-nums}
.big small{font-size:1.5rem;color:var(--muted)}
.score .msg2{flex:1;min-width:11.25rem}
.score .msg2 b{display:block;font-size:1.125rem}
.score .msg2 span{color:var(--muted);font-size:0.875rem}
.parts{display:flex;flex-wrap:wrap;gap:0.5rem;padding:0.75rem 1rem;border-bottom:1px solid var(--line)}
.parts span{font:500 0.8125rem/1 var(--f-num);border:1px solid var(--line);border-radius:999px;padding:0.375rem 0.625rem;font-variant-numeric:tabular-nums}
.rlist details{border-bottom:1px solid var(--line)}
.rlist details:last-child{border-bottom:0}
.rlist summary{display:grid;grid-template-columns:1.5rem 1fr auto;gap:0.625rem;align-items:center;padding:0.625rem 1rem;cursor:pointer;list-style:none}
.rlist summary::-webkit-details-marker{display:none}
.rlist .g{font-weight:700}
.rlist .g.ok{color:var(--good)}
.rlist .g.ng{color:var(--bad)}
.rlist .s{font-family:var(--f-en);font-size:0.9375rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rlist .s em{font-style:normal;font-family:var(--f-num);font-size:0.75rem;color:var(--print);margin-right:0.375rem}
.rlist .r{font:500 0.75rem/1.3 var(--f-num);color:var(--muted);text-align:right;white-space:nowrap}
.rx{padding:0 1rem 0.875rem 3.125rem;font-size:0.9375rem}
.rx p{margin:0.25rem 0 0}
.rx .zh{color:var(--muted)}

/* Flashcards */
.bar{height:0.375rem;background:var(--line);border-radius:0.1875rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--print)}
.fcard{min-height:18.75rem;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2.25rem 1.25rem 1.75rem;cursor:pointer;position:relative;gap:0.625rem;background-image:repeating-linear-gradient(to bottom,transparent 0 1.9375rem,var(--print-soft) 1.9375rem 2rem)}
.fpos{font-family:var(--f-num);color:var(--print);font-size:0.875rem}
.fword{font-family:var(--f-en);font-weight:600;font-size:clamp(1.875rem,9vw,2.875rem);line-height:1.15;overflow-wrap:anywhere}
.fzh{font-size:1.5rem;font-weight:700}
.fex{font-family:var(--f-en);font-size:1.0625rem;color:var(--muted);max-width:34ch}
.hint{font-size:0.875rem;color:var(--muted)}
.say{position:absolute;top:0.625rem;right:0.625rem;width:2.5rem;height:2.5rem;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;cursor:pointer}
.say svg{width:1.125rem;height:1.125rem;fill:var(--print)}
.cbtns{display:grid;grid-template-columns:1fr 1fr;gap:0.625rem}
.cbtns .btn{width:100%}
.done-card{padding:1.75rem 1rem;text-align:center;display:flex;flex-direction:column;gap:0.875rem;align-items:center}
.done-card p{margin:0}
.done-card .row{display:flex;gap:0.625rem;flex-wrap:wrap;justify-content:center}

/* Word lookup: every English word in a question can be tapped */
.w,.ph{border-radius:2px;-webkit-tap-highlight-color:transparent}
.w{cursor:pointer}
.w.saved,.ph.saved{text-decoration:underline dotted var(--print);text-decoration-thickness:1.5px;text-underline-offset:0.1875rem}
.w.on,.ph.on{background:var(--lead);color:var(--lead-ink);box-shadow:0 0 0 2px var(--lead);text-decoration:none}
.qhint{margin-left:auto;font-family:var(--f-ui);font-size:0.75rem;color:var(--muted)}
.wpop{position:fixed;z-index:30;width:21.25rem;max-width:calc(100vw - 1.5rem);background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:0.375rem;box-shadow:0 0.75rem 2rem rgba(0,0,0,.18);overflow:hidden}
.wpop[hidden]{display:none}
.wp-band{display:flex;align-items:center;justify-content:space-between;gap:0.5rem;background:var(--print);color:var(--sheet);font:600 0.875rem/1 var(--f-form);letter-spacing:.08em;padding-left:1rem;min-height:2.375rem}
.wp-x{width:2.75rem;height:2.375rem;border:0;background:none;color:inherit;font-size:1rem;cursor:pointer}
.wp-body{padding:0.75rem 1rem 0.875rem;display:flex;flex-direction:column;gap:0.375rem}
.wp-head{display:flex;align-items:center;justify-content:space-between;gap:0.75rem}
.wp-word{font:600 1.625rem/1.2 var(--f-en);overflow-wrap:anywhere}
.wp-say{flex:none;width:2.375rem;height:2.375rem;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;cursor:pointer}
.wp-say svg{width:1.125rem;height:1.125rem;fill:var(--print)}
.wp-form{font-size:0.8125rem;color:var(--muted);margin-top:-0.25rem}
.wp-form span{font-family:var(--f-en);color:var(--ink)}
.wp-zh{font-size:1.25rem;font-weight:700;line-height:1.4}
.wp-note{margin:0;font-size:0.9375rem;line-height:1.6}
.wp-sub{margin:2px 0 0;padding-top:0.5rem;border-top:1px dashed var(--line);font-size:0.875rem;color:var(--muted)}
.wp-sub b{font-family:var(--f-en);color:var(--ink);margin-right:0.5rem}
.wp-act{display:flex;align-items:center;justify-content:space-between;gap:0.75rem;margin-top:0.5rem;flex-wrap:wrap}
.wp-save{display:inline-flex;align-items:center;gap:0.5rem;min-height:2.375rem;border:1px solid var(--line);border-radius:999px;background:var(--sheet);padding:0.375rem 0.875rem 0.375rem 0.5rem;font-size:0.875rem;cursor:pointer}
.wp-save:hover{border-color:var(--print)}
.wp-save i{width:1.25rem;height:1.25rem;border-radius:50%;border:1.5px solid var(--print);flex:none}
.wp-save[aria-pressed="true"] i{background:var(--lead);border-color:var(--lead)}
.wp-save.anim i{animation:fill .32s cubic-bezier(.2,.8,.2,1)}
.wp-more{font-size:0.8125rem;color:var(--muted)}
@keyframes sheet-up{from{transform:translateY(1.5rem);opacity:0}to{transform:none;opacity:1}}
/* Phone: the explanation rises from the bottom like a sheet; larger screens get a card beside the word */
@media (max-width:639px){
  .wpop{left:0;right:0;bottom:0;width:auto;max-width:none;border-radius:0.75rem 0.75rem 0 0;border-width:1px 0 0;max-height:75vh;overflow:auto;padding-bottom:env(safe-area-inset-bottom);animation:sheet-up .22s cubic-bezier(.2,.8,.2,1)}
}

/* Keyboard hints only where there is a keyboard and mouse */
@media (hover:hover) and (pointer:fine){
  .kbd{display:block}
  .w:hover{text-decoration:underline dotted var(--print);text-decoration-thickness:1.5px;text-underline-offset:0.1875rem}
}

/* Tablet: wider sheet, practice modes in two columns */
@media (min-width:640px){
  .wrap{max-width:47.5rem;padding:1.75rem 1.5rem 2rem;gap:1.25rem}
  .home-main,.home-side{gap:1.25rem}
  .modes{display:grid;grid-template-columns:1fr 1fr}
  .modes .mode.primary{grid-column:1 / -1}
  .modes .mode:not(.primary):nth-child(even){border-right:1px solid var(--line)}
  .modes .mode:not(.primary) .go{display:none}
  .modes .mode:not(.primary):last-child:nth-child(even){grid-column:1 / -1;border-right:0}
  .home-side{display:grid;grid-template-columns:1fr 1fr}
  .qcard{padding:1.25rem 1.5rem}
  .prompt{font-size:1.25rem}
  .fcard{min-height:22.5rem}
  .wrap[data-view="result"]{max-width:53.75rem}
}

/* Desktop and landscape tablet: home in two columns; Part 6/7 like the test book, passage left and answers right */
@media (min-width:1024px){
  .wrap[data-view="home"]{max-width:70rem;display:grid;grid-template-columns:minmax(0,1fr) 21.25rem;gap:1.5rem;align-items:start}
  .wrap[data-view="home"] .prefs{grid-column:1 / -1;margin-bottom:-0.5rem}
  .wrap[data-view="home"] .home-side{display:flex;position:sticky;top:1.5rem}
  .wrap[data-view="quiz-p"]{max-width:73.75rem}
  .qcard.has-p{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:2rem;align-items:start;overflow:visible;padding:1.5rem}
  .qcard.has-p .passage{position:sticky;top:1.25rem;max-height:calc(100vh - 2.5rem);overflow:auto;margin:0}
  .qcard.has-p .ptext{font-size:1.0625rem}
}

/* Large desktop screens: every size is in rem, so raising the root size enlarges type, spacing and
   column widths together and the page keeps filling the window (about +11% at 1536, +28% at 1920, at most +50%) */
@media (min-width:1280px){
  html{font-size:clamp(16px, calc(.7vw + 7px), 24px)}
  .wrap[data-view="quiz"],.wrap[data-view="cards"]{max-width:54rem}
  .wrap[data-view="result"]{max-width:60rem}
  .foot{max-width:54rem}
  .fcard{min-height:26rem}
  .fex{max-width:44ch}
}

@media (max-width:400px){
  .mode{grid-template-columns:3.75rem 1fr}
  .mode .go{display:none}
  .stat{padding:0.625rem 0.75rem}
  .prompt{font-size:1.125rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

const PH_ALIAS = {"don't hesitate to":"do not hesitate to","in detail":"in more detail","turns off":"turn off","turned off":"turn off","fills up":"fill up","filled up":"fill up","taking the time":"take the time","took the time":"take the time"};

/* ---------------- Word lookup: find the dictionary entry for a word in the text ---------------- */
const WORD_RE = /[0-9]+[A-Za-z]+|[AaPp]\.[Mm]\.|[A-Za-zÀ-ÿ]+(?:['’-][A-Za-zÀ-ÿ]+)*/g;
function lemmaCands(w){
  const out = [], add = x => { if (x.length > 1 && !out.includes(x)) out.push(x); };
  if (/'s$/.test(w)){ w = w.slice(0,-2); add(w); }
  if (/ies$/.test(w)) add(w.slice(0,-3) + "y");
  if (/s$/.test(w) && !/ss$/.test(w)) add(w.slice(0,-1));
  if (/(?:ch|sh|x|ss|z|o)es$/.test(w)) add(w.slice(0,-2));
  if (/ied$/.test(w)) add(w.slice(0,-3) + "y");
  if (/ed$/.test(w)){ add(w.slice(0,-1)); add(w.slice(0,-2)); if (/([^aeiou])\1ed$/.test(w)) add(w.slice(0,-3)); }
  if (/ing$/.test(w)){ add(w.slice(0,-3)); add(w.slice(0,-3) + "e"); if (/([^aeiou])\1ing$/.test(w)) add(w.slice(0,-4)); }
  if (/er$/.test(w)){ add(w.slice(0,-1)); add(w.slice(0,-2)); }
  if (/est$/.test(w)){ add(w.slice(0,-2)); add(w.slice(0,-3)); }
  return out;
}
/* null = never tappable (names, numbers); "" = tappable but not in the dictionary yet */
function lookupKey(tok){
  if (/^[0-9]/.test(tok)) return null;
  const w = tok.toLowerCase().replace(/’/g, "'");
  if (NAMES.has(w.replace(/'s$/, "")) || (w.length === 1 && !DICT[w])) return null;
  if (DICT[w]) return w;
  if (FORMS[w]) return FORMS[w];
  for (const c of lemmaCands(w)){ if (DICT[c]) return c; if (FORMS[c]) return FORMS[c]; }
  return "";
}
const PH_RE = new RegExp("\\b(?:" + [...Object.keys(PHRASES), ...Object.keys(PH_ALIAS)]
  .sort((a,b) => b.length - a.length)
  .map(k => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/'/g, "['’]").replace(/ /g, "\\s+"))
  .join("|") + ")\\b", "gi");
function phraseKey(s){
  const k = s.toLowerCase().replace(/’/g, "'").replace(/\s+/g, " ");
  return PHRASES[k] ? k : (PH_ALIAS[k] || "");

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function shuffle(a){ a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function pickOne(a){ return a[Math.floor(Math.random()*a.length)]; }

/* ---------------- Speech (Part 2 + vocab) ---------------- */
const tts = { ok: ("speechSynthesis" in window) && ("SpeechSynthesisUtterance" in window), voices: [] };
function loadVoices(){ try { tts.voices = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang)); } catch(e){} }
if (tts.ok){ loadVoices(); try { speechSynthesis.addEventListener("voiceschanged", loadVoices); } catch(e){ speechSynthesis.onvoiceschanged = loadVoices; } }
function voicePair(){
  const us = tts.voices.filter(v => /en[-_]US/i.test(v.lang));
  const pool = us.length ? us : tts.voices;
  const other = tts.voices.filter(v => !/en[-_]US/i.test(v.lang));
  return [pool[0] || null, other[0] || pool[1] || pool[0] || null];
}
let speakToken = 0;
function setSpeaking(on){ const b = document.getElementById("playbtn"); if (b){ b.classList.toggle("on", on); b.innerHTML = ICON_PLAY + " " + (on ? tx("播放中…點我重播", "Playing… tap to replay") : tx("播放題目", "Play")); } }
function speakSeq(parts){
  if (!tts.ok) return;
  try { speechSynthesis.cancel(); } catch(e){}
  const token = ++speakToken;
  let i = 0;
  const step = () => {
    if (token !== speakToken) return;
    if (i >= parts.length){ setSpeaking(false); return; }
    const p = parts[i++];
    try {
      const u = new SpeechSynthesisUtterance(p.text);
      u.lang = p.voice ? p.voice.lang : "en-US";
      if (p.voice) u.voice = p.voice;
      u.rate = p.rate || 0.92;
      u.onend = () => setTimeout(step, p.gap || 300);
      u.onerror = () => { if (token === speakToken) setTimeout(step, 100); };
      speechSynthesis.speak(u);
    } catch(e){ setSpeaking(false); }
  };
  setSpeaking(true);
  step();
}
function stopSpeech(){ speakToken++; if (tts.ok){ try { speechSynthesis.cancel(); } catch(e){} } }
function playItem(it){
  const [v1, v2] = voicePair();
  const parts = [{text:it.q, voice:v1, gap:1000}];
  it.o.forEach((o,i) => { parts.push({text:L[i], voice:v2, gap:250}); parts.push({text:o, voice:v2, gap:800}); });
  speakSeq(parts);
}

const POS_ZH = {"n.":"名詞","v.":"動詞","adj.":"形容詞","adv.":"副詞","prep.":"介系詞","conj.":"連接詞","pron.":"代名詞","det.":"限定詞","aux.":"助動詞","art.":"冠詞","num.":"數詞","int.":"感嘆詞","phr.":"片語","abbr.":"縮寫"};
const POS_EN = {"n.":"noun","v.":"verb","adj.":"adjective","adv.":"adverb","prep.":"preposition","conj.":"conjunction","pron.":"pronoun","det.":"determiner","aux.":"auxiliary","art.":"article","num.":"number","int.":"interjection","phr.":"phrase","abbr.":"abbreviation"};
function posLabel(p){
  if (!p) return tx("縮寫", "contraction");
  return lang === "en" ? p.split("/").map(x => POS_EN[x] || x).join(" / ") : p.split("/").map(x => POS_ZH[x] || x).join("／") + "　" + p;
}
function entryOf(k){ return (k && (PHRASES[k] || DICT[k])) || null; }
function shownWord(k){ const e = DICT[k]; return (e && e[3]) || k; }
function isSaved(k){ return !!k && Object.prototype.hasOwnProperty.call(store.mywords, k); }
const dictURL = q => "https://tw.dictionary.search.yahoo.com/search?p=" + encodeURIComponent(q);

function wrapWords(parent, text){
  const re = new RegExp(WORD_RE.source, "g");
  let pos = 0, m;
  while ((m = re.exec(text))){
    const key = lookupKey(m[0]);
    if (key === null) continue;
    if (m.index > pos) parent.appendChild(document.createTextNode(text.slice(pos, m.index)));
    const s = document.createElement("span");
    s.className = "w" + (isSaved(key) ? " saved" : "");
    s.dataset.k = key;
    s.textContent = m[0];
    parent.appendChild(s);
    pos = m.index + m[0].length;
  }
  if (pos < text.length) parent.appendChild(document.createTextNode(text.slice(pos)));
}
/* Turn the English text inside these elements into tappable words; phrases become one unit */
function wordify(roots){
  roots.forEach(root => {
    const nodes = [];
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    while (walker.nextNode()){
      const n = walker.currentNode;
      if (/[A-Za-z]/.test(n.nodeValue) && !n.parentElement.closest(".who, .w, .ph")) nodes.push(n);
    }
    nodes.forEach(node => {
      const text = node.nodeValue, frag = document.createDocumentFragment();
      const re = new RegExp(PH_RE.source, "gi");
      let pos = 0, m;
      while ((m = re.exec(text))){
        const key = phraseKey(m[0]);
        if (!key) continue;
        wrapWords(frag, text.slice(pos, m.index));
        const ph = document.createElement("span");
        ph.className = "ph" + (isSaved(key) ? " saved" : "");
        ph.dataset.k = key;
        wrapWords(ph, m[0]);
        frag.appendChild(ph);
        pos = m.index + m[0].length;
      }
      wrapWords(frag, text.slice(pos));
      node.parentNode.replaceChild(frag, node);
    });
  });
}
/* The sentence a word was found in, kept with the word in the 生字本 */
function contextOf(el){
  const block = el.closest(".prompt, .otext, .transcript, .fex, p, li, h4");
  if (!block) return "";
  let txt = "", at = -1;
  (function walk(n){
    for (const c of n.childNodes){
      if (c === el) at = txt.length;
      if (c.nodeType === 3) txt += c.nodeValue.replace(/ +/g, "____");
      else if (c.nodeName === "BR") txt += " ";
      else if (c.nodeType === 1) walk(c);
    }
  })(block);
  if (at < 0) at = 0;
  const isEnd = k => /[.?!]/.test(txt[k]) && (k + 1 >= txt.length || /\s/.test(txt[k+1])) && !/(?:\b(?:Mr|Ms|Mrs|Dr|St)|[AP]\.M)\.$/.test(txt.slice(Math.max(0, k-4), k+1));
  let a = 0, b = txt.length;
  for (let k = at - 1; k >= 0; k--) if (isEnd(k)){ a = k + 1; break; }
  for (let k = at; k < txt.length; k++) if (isEnd(k)){ b = k + 1; break; }
  return txt.slice(a, b).replace(/\s+/g, " ").trim().slice(0, 240);
}

function build(mode){

  stopTimer();

function select(i, why){
  if (!quiz) return;
  const it = quiz.items[quiz.idx];
  if (quiz.answers[it.id]) return;
  stopTimer();
  const pick = (i === null || i < 0) ? null : i;
  const ok = pick === it.a;
  quiz.answers[it.id] = {pick, ok, why};
  store.answered++;
  if (ok){ store.correct++; store.wrong = store.wrong.filter(x => x !== it.id); }
  else if (!store.wrong.includes(it.id)) store.wrong.push(it.id);

    </button>`).join("")}</div>
    <div class="opt-row">
      <p><strong>${tx("限時模式", "Timed mode")}</strong>${tx("Part 5 每題 30 秒、Part 6 40 秒、Part 7 60 秒，模擬正式考試節奏", "30 seconds per question in Part 5, 40 in Part 6 and 60 in Part 7, close to the real test pace")}</p>
      <label class="switch"><input type="checkbox" id="timed" ${store.timed ? "checked" : ""} aria-label="${tx("限時模式", "Timed mode")}"><span class="track"></span></label>
    </div>
  </section>
  </div>

  <aside class="home-side">
  <section class="sheet" aria-labelledby="h-check">
    <div class="sec-head" id="h-check">${tx("出門前檢查", "Before you leave")}<small>${tx("勾選會記在這台裝置", "Saved on this device")}</small></div>
    <ul class="check">
      ${checks.map(([k,t]) => `<li><label><input type="checkbox" id="chk-${k}" data-check="${k}" ${store.checks[k] ? "checked" : ""}><span>${t}</span></label></li>`).join("")}
    </ul>
  </section>

  <section class="sheet" aria-labelledby="h-tips">
    <div class="sec-head" id="h-tips">${tx("作答策略", "Test strategy")}</div>
    <ol class="tips">
      ${tips.map(x => `<li>${x}</li>`).join("")}
    </ol>
  </section>
  </aside>`;
}

/* ---------------- Render: quiz ---------------- */
function promptHTML(it, rev){
  if (it.part === 2) return `<span class="inst">${tx("聽題目和三個回應，選出最適當的回答。", "Listen to the question and three responses, then choose the best response.")}</span>`;
  if (it.part === 5){
    const fill = rev ? `<span class="blank done">${esc(it.o[it.a])}</span>` : `<span class="blank" aria-label="${tx("空格", "blank")}">&nbsp;</span>`;
    return esc(it.q).replace(/-{3,}/, fill);
  }
  if (it.part === 6) return it.insert ? tx(`哪一個句子最適合放進 [${it.blank}]？`, `Which sentence best fits in [${it.blank}]?`) : tx(`[${it.blank}] 應該填入哪一個？`, `Which choice best completes [${it.blank}]?`);
  return esc(it.q);
}

function passageHTML(it){
  const p = it.passage;
  let body = p.body;
  if (it.part === 6){
    body = body.replace(/\{(\d)\}/g, (m, k) => {
      k = +k;
      const q = p.qs[k-1];
      const a = quiz.answers[`${p.id}-${k}`];
      if (a) return `<span class="pb done${q.insert ? " ins" : ""}">${esc(q.o[q.a])}</span>`;
      return `<span class="pb${it.blank === k ? " cur" : ""}">[${k}]</span>`;
    });
  }
  const extra = it.part === 7 ? tx(` · 第 ${it.qi}/${p.qs.length} 題`, ` · Question ${it.qi} of ${p.qs.length}`) : "";
  return `<details class="passage" open><summary>${esc(ptitle(p))}${extra}</summary><div class="ptext">${p.head ? `<div class="phead">${p.head}</div>` : ""}${body}</div></details>`;
}

function audioHTML(it, rev){
  let h = `<div class="audio">`;
  if (tts.ok) h += `<button class="play" data-act="play" id="playbtn">${ICON_PLAY} ${tx("播放題目", "Play")}</button>`;
  if (!rev) h += `<button class="btn-ghost" data-act="script">${quiz.showScript ? tx("隱藏文字稿", "Hide script") : tx("看文字稿", "Show script")}</button>`;
  h += `</div>`;
  if (!tts.ok) h += `<p class="note">${tx("這個瀏覽器不支援語音朗讀，先用文字稿練習題型。", "This browser can't read text aloud, so practice with the script for now.")}</p>`;
  if (quiz.showScript || rev) h += `<div class="transcript"><b>Q:</b> ${esc(it.q)}</div>`;
  return h;
}

function explainHTML(it, ans){
  const verdict = ans.why === "time" ? tx("時間到", "Time's up") : ans.why === "skip" ? tx("已略過", "Skipped") : ans.ok ? tx("✓ 答對了", "✓ Correct") : tx("✗ 答錯了", "✗ Incorrect");
  return `<div class="explain" id="explain">
    <div class="verdict ${ans.ok ? "ok" : "ng"}">${verdict}<span class="ans">${tx("正解", "Answer")} (${L[it.a]})</span></div>
    <p lang="zh-Hant">${it.ex}</p>
    ${it.zh ? `<p class="zh">${tx("中譯：", "Translation: ")}<span lang="zh-Hant">${it.zh}</span></p>` : ""}
  </div>`;
}

function renderQuiz(anim){
  const it = quiz.items[quiz.idx];
  const ans = quiz.answers[it.id];
  const rev = !!ans;
  const secs = timedFor(it);
  const showText = it.part !== 2 || rev || quiz.showScript;
  closeWord();
  $app.dataset.view = it.passage ? "quiz-p" : "quiz";
  let h = prefsHTML() + `<div class="qtop"><button class="btn-ghost" data-act="home">${tx("← 首頁", "← Home")}</button><span class="qtitle">${esc(titleOf(quiz.mode))}</span><span class="qcount"><span class="tl" id="tleft"></span>${quiz.idx+1}/${quiz.items.length}</span></div>`;
  h += `<div class="strip" role="list" aria-label="${tx("作答進度", "Progress")}">` + quiz.items.map((x,i) => {
    const a = quiz.answers[x.id];
    const cls = a ? (a.ok ? "ok" : "ng") : (i === quiz.idx ? "cur" : "");
    const lab = tx(`第 ${i+1} 題`, `Question ${i+1}`) + (a ? (a.ok ? tx("，答對", ", correct") : tx("，答錯", ", incorrect")) : (i === quiz.idx ? tx("，作答中", ", current") : ""));
    return `<i role="listitem" class="${cls}" aria-label="${lab}">${a ? (a.ok ? "✓" : "✗") : i+1}</i>`;
  }).join("") + `</div>`;
  if (secs && !rev) h += `<div class="timer" aria-hidden="true"><i id="tbar"></i></div>`;
  h += `<article class="sheet qcard${it.passage ? " has-p" : ""}">`;
  if (it.part === 6 || it.part === 7) h += passageHTML(it);
  h += `<div class="qbody"><div class="qnum"><span>No. ${quiz.idx+1}</span><span class="ptag">PART ${it.part}</span>${showText ? `<span class="qhint">${tx("點英文單字看中文", "Tap a word for its Chinese meaning")}</span>` : ""}</div>`;
  if (it.part === 2) h += audioHTML(it, rev);
  h += `<p class="prompt">${promptHTML(it, rev)}</p>`;
  h += `<div class="opts">` + it.o.map((o,i) => {
    const picked = rev && ans.pick === i;
    const right = rev && i === it.a;
    const wrong = picked && !right;
    const cls = ["opt", picked ? "picked" : "", picked && anim ? "anim" : "", right ? "right" : "", wrong ? "wrong" : ""].filter(Boolean).join(" ");
    const text = showText ? esc(o) : `<span class="hid">${tx("選項", "Option")} ${L[i]}</span>`;
    const mk = right ? tx("✓ 正解", "✓ Answer") : wrong ? tx("✗ 你的答案", "✗ Your answer") : "";
    // After answering, options become plain text so their words can be looked up
    if (rev) return `<div class="${cls}"><span class="bub">${L[i]}</span><span class="otext">${text}</span><span class="mk">${mk}</span></div>`;
    return `<button class="${cls}" data-act="pick" data-i="${i}" aria-label="${tx("選項", "Option")} ${L[i]}${showText ? tx("：", ": ") + esc(o) : ""}"><span class="bub" aria-hidden="true">${L[i]}</span><span class="otext">${text}</span><span class="mk"></span></button>`;
  }).join("") + `</div>`;
  if (rev) h += explainHTML(it, ans);
  h += `</div></article>`;
  h += `<div class="qnav">` + (rev
    ? `<button class="btn" data-act="next" id="nextbtn">${quiz.idx+1 < quiz.items.length ? tx("下一題 →", "Next →") : tx("看成績 →", "See results →")}</button>`
    : `<button class="btn alt" data-act="skip">${tx("不會，看解答", "Show the answer")}</button>`) + `</div>`;
  h += `<p class="kbd">${rev
    ? tx(`按 <kbd>Enter</kbd> 或 <kbd>→</kbd> 到下一題`, `Press <kbd>Enter</kbd> or <kbd>→</kbd> for the next question`)
    : tx(`按 <kbd>A</kbd>–<kbd>${L[it.o.length-1]}</kbd> 或 <kbd>1</kbd>–<kbd>${it.o.length}</kbd> 作答`, `Press <kbd>A</kbd>–<kbd>${L[it.o.length-1]}</kbd> or <kbd>1</kbd>–<kbd>${it.o.length}</kbd> to answer`)}</p>`;
  $app.innerHTML = h;
  wordify($app.querySelectorAll(".prompt, .ptext, .transcript, div.opt .otext"));
  if (secs && !rev) runTimer(secs);
}

/* ---------------- Render: result ---------------- */
function snippet(it){
  if (it.part === 5) return esc(it.q.replace(/-{3,}/, "_____"));
  if (it.part === 6) return `${esc(ptitle(it.passage))} [${it.blank}]`;
  return esc(it.q);
}
function isRight(x){ return !!(quiz.answers[x.id] && quiz.answers[x.id].ok); }
function renderResult(){
  closeWord();
  $app.dataset.view = "result";
  const items = quiz.items, n = items.length;
  const c = items.filter(isRight).length;
  const pct = Math.round(c/n*100);
  const msg = pct >= 90 ? tx("很穩！考試照這個節奏就好。", "Solid! Keep this pace on test day.")
    : pct >= 70 ? tx("不錯！把錯的解析看過一遍。", "Nice! Read the explanations for the ones you missed.")
    : pct >= 50 ? tx("看懂解析比多做題重要，挑錯題再練一次。", "Understanding the explanations matters more than doing more questions. Retry the ones you missed.")
    : tx("別緊張，先把錯題的解析看完，再練一輪。", "Don't worry. Read the explanations for your mistakes, then try another round.");
  const wrongItems = items.filter(x => !isRight(x));
  const parts = [...new Set(items.map(x => x.part))].sort();
  const partTally = parts.map(p => { const xs = items.filter(x => x.part === p); return `<span>PART ${p} · ${xs.filter(isRight).length}/${xs.length}</span>`; }).join("");
  const againLabel = quiz.mode === "wrong" ? (store.wrong.length ? tx("再練錯題本", "Practice mistakes again") : null) : quiz.mode === "retry" ? null : tx("再來一回", "Another round");
  $app.innerHTML = `${prefsHTML()}
  <div class="qtop"><button class="btn-ghost" data-act="home">${tx("← 首頁", "← Home")}</button><span class="qtitle">${esc(titleOf(quiz.mode))} · ${tx("成績", "Results")}</span></div>
  <section class="sheet">
    <div class="score"><div class="big">${c}<small>/${n}</small></div><div class="msg2"><b>${msg}</b><span>${tx(`正確率 ${pct}%。`, `Accuracy ${pct}%. `)}${wrongItems.length ? tx("錯的題目已收進錯題本，點下面任一題看解析。", "Missed questions are saved to Mistakes. Tap any question below to see its explanation.") : tx("全部答對！", "All correct!")}</span></div></div>
    ${parts.length > 1 ? `<div class="parts">${partTally}</div>` : ""}
    <div class="rlist">
      ${items.map((it,i) => {
        const a = quiz.answers[it.id] || {pick:null, ok:false};
        const yours = a.pick === null ? "—" : L[a.pick];
        return `<details><summary><span class="g ${a.ok ? "ok" : "ng"}" aria-label="${a.ok ? tx("答對", "correct") : tx("答錯", "incorrect")}">${a.ok ? "✓" : "✗"}</span><span class="s"><em>${i+1} · P${it.part}</em>${snippet(it)}</span><span class="r">${tx("你", "You")} ${yours}<br>${tx("正解", "Answer")} ${L[it.a]}</span></summary>
          <div class="rx"><p><b>(${L[it.a]}) ${esc(it.o[it.a])}</b></p><p lang="zh-Hant">${it.ex}</p>${it.zh ? `<p class="zh">${tx("中譯：", "Translation: ")}<span lang="zh-Hant">${it.zh}</span></p>` : ""}</div></details>`;
      }).join("")}
    </div>
  </section>
  <div class="qnav">
    ${wrongItems.length ? `<button class="btn" data-act="retry">${tx(`重練這 ${wrongItems.length} 題`, `Retry these ${wrongItems.length}`)}</button>` : ""}
    ${againLabel ? `<button class="btn alt" data-act="again-quiz">${againLabel}</button>` : ""}
    <button class="btn alt" data-act="home">${tx("回首頁", "Home")}</button>
  </div>`;
}

/* ---------------- Render: flashcards ---------------- */
/* A card is [word, part of speech, 中文, example sentence, dictionary key (生字本 only)] */
function savedKeys(){ return Object.keys(store.mywords).filter(k => entryOf(k)); }
function myCards(){ return shuffle(savedKeys().map(k => { const e = entryOf(k); return [shownWord(k), e[0], e[1], store.mywords[k] || e[2], k]; })); }
function startCards(cards, mine){
  stopTimer(); stopSpeech();
  deck = {cards: cards || shuffle(VOCAB), mine: !!mine, i:0, flipped:false, known:0, again:[]};
  view = "cards";
  renderCards();
  window.scrollTo(0,0);
}
function advanceCard(){ deck.i++; deck.flipped = false; renderCards(); }
function knowCard(){
  deck.known++;
  if (deck.mine){ delete store.mywords[deck.cards[deck.i][4]]; save(); }
  advanceCard();
}
function renderCards(){
  closeWord();
  $app.dataset.view = "cards";
  const total = deck.cards.length;
  const title = deck.mine ? tx("生字本", "My words") : tx("高頻單字卡", "Key vocabulary cards");
  const home = `<button class="btn-ghost" data-act="home">${tx("← 首頁", "← Home")}</button>`;
  if (deck.i >= total){
    const left = deck.mine ? savedKeys().length : 0;
    const k = deck.known, a = deck.again.length;
    $app.innerHTML = `${prefsHTML()}
    <div class="qtop">${home}<span class="qtitle">${title}</span></div>
    <section class="sheet done-card">
      <div class="big">${k}<small>/${total}</small></div>
      <p>${tx(`記住 ${k} 個${deck.mine && k ? "，已移出生字本" : ""}；還不熟 ${a} 個。`, `Got ${k}${deck.mine && k ? " (removed from My words)" : ""}; ${a} still to learn.`)}</p>
      <div class="row">
        ${a ? `<button class="btn" data-act="cards-again">${tx(`複習不熟的 ${a} 個`, `Review the ${a} still to learn`)}</button>` : ""}
        ${deck.mine ? (left > a ? `<button class="btn alt" data-act="mywords">${tx(`生字本全部 ${left} 個`, `All ${left} in My words`)}</button>` : "") : `<button class="btn alt" data-act="cards-all">${tx("整副重來", "Restart the deck")}</button>`}
        <button class="btn alt" data-act="home">${tx("回首頁", "Home")}</button>
      </div>
    </section>`;
    return;
  }
  const [w, pos, zh, ex] = deck.cards[deck.i];
  $app.innerHTML = `${prefsHTML()}
  <div class="qtop">${home}<span class="qtitle">${title}</span><span class="qcount">${deck.i+1}/${total}</span></div>
  <div class="bar" aria-hidden="true"><i style="width:${deck.i/total*100}%"></i></div>
  <div class="sheet fcard" data-act="flip" role="button" tabindex="0" aria-label="${deck.flipped ? tx("翻回正面", "Flip back") : tx("翻面看中文", "Flip to see the Chinese")}">
    ${tts.ok ? `<button class="say" data-act="say" aria-label="${tx("唸出", "Say")} ${esc(w)}">${ICON_SPEAK}</button>` : ""}
    <span class="fpos">${esc(pos)}</span>
    <div class="fword">${esc(w)}</div>
    ${deck.flipped ? `<div class="fzh" lang="zh-Hant">${esc(zh)}</div>${ex ? `<div class="fex">${esc(ex)}</div>` : ""}` : `<div class="hint">${deck.mine ? tx("點卡片看中文和你遇到它的句子", "Tap the card for the Chinese and the sentence you found it in") : tx("點卡片看中文和例句", "Tap the card for the Chinese and an example")}</div>`}
  </div>
  <div class="cbtns"><button class="btn alt" data-act="again">${tx("還不熟", "Still learning")}</button><button class="btn" data-act="know">${tx("記住了", "Got it")}</button></div>
  <p class="kbd kbd-c">${tx("按 <kbd>Space</kbd> 翻面，<kbd>←</kbd> 還不熟，<kbd>→</kbd> 記住了", "<kbd>Space</kbd> flips the card, <kbd>←</kbd> still learning, <kbd>→</kbd> got it")}</p>`;
  if (deck.flipped) wordify($app.querySelectorAll(".fex"));
}

/* ---------------- Events ---------------- */
$app.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t || t.disabled) return;
  switch (t.dataset.act){
    case "start": startQuiz(t.dataset.mode); break;
    case "cards": startCards(); break;
    case "mywords": if (savedKeys().length) startCards(myCards(), true); else goHome(); break;
    case "home": goHome(); break;
    case "pick": select(+t.dataset.i, "pick"); break;
    case "skip": select(null, "skip"); break;
    case "next": next(); break;
    case "play": if (quiz) playItem(quiz.items[quiz.idx]); break;
    case "script": quiz.showScript = !quiz.showScript; renderQuiz(false); break;
    case "again-quiz": startQuiz(quiz.mode); break;
    case "retry": startQuiz("retry", quiz.items.filter(x => !isRight(x))); break;
    case "flip": deck.flipped = !deck.flipped; renderCards(); break;
    case "say": sayWord(deck.cards[deck.i][0]); break;
    case "know": knowCard(); break;
    case "again": deck.again.push(deck.cards[deck.i]); advanceCard(); break;
    case "cards-again": startCards(shuffle(deck.again), deck.mine); break;
    case "cards-all": startCards(); break;
    case "lang":
      if (lang !== t.dataset.v){ lang = store.lang = t.dataset.v; save(); applyLang(); rerender(); }
      break;
    case "theme":
      store.theme = t.dataset.v; save(); applyTheme();
      document.querySelectorAll('[data-act="theme"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.v === currentTheme()));
      break;
    case "exam-edit": examEditing = true; renderHome(); { const d = document.getElementById("exam-date"); if (d) d.focus(); } break;
    case "exam-cancel": examEditing = false; renderHome(); break;
    case "exam-clear": store.exam = ""; examEditing = false; save(); renderHome(); break;
  }
});
$app.addEventListener("submit", e => {
  if (e.target.id !== "exam-form") return;
  e.preventDefault();
  const d = document.getElementById("exam-date").value, tm = document.getElementById("exam-time").value || "09:30";
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || !/^\d{2}:\d{2}$/.test(tm)) return;
  store.exam = `${d}T${tm}`; examEditing = false; save(); renderHome();
});
/* Redraw the current screen after a language switch; quiz answers and timers are kept */
function rerender(){
  if (view === "quiz" && quiz) renderQuiz(false);
  else if (view === "result" && quiz) renderResult();
  else if (view === "cards" && deck) renderCards();
  else renderHome();
}
if (darkMQ.addEventListener) darkMQ.addEventListener("change", () => {
  document.querySelectorAll('[data-act="theme"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.v === currentTheme()));
});
$app.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "timed"){ store.timed = el.checked; save(); }
  else if (el.dataset && el.dataset.check){ store.checks[el.dataset.check] = el.checked; save(); }
});
/* Word taps are handled before anything else, so a word in a flashcard sentence does not flip the card.
   While the explanation is open, a tap elsewhere only closes it. */
document.addEventListener("click", e => {
  const t = e.target.closest ? e.target.closest(".w, .ph") : null;
  if (t && $app.contains(t)){
    e.preventDefault(); e.stopPropagation();
    if (cur && cur.el === t) closeWord(); else openWord(t);
    return;
  }
  if (cur && pop && !pop.contains(e.target)){ e.preventDefault(); e.stopPropagation(); closeWord(); }
}, true);
window.addEventListener("scroll", () => { if (cur && wideMQ.matches) placeWord(); }, {capture:true, passive:true});
window.addEventListener("resize", () => { if (cur) placeWord(); });

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && cur){ closeWord(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const ae = document.activeElement;
  if (view === "quiz" && quiz){
    const it = quiz.items[quiz.idx];
    const k = e.key.toLowerCase();
    const map = {a:0,b:1,c:2,d:3,"1":0,"2":1,"3":2,"4":3};
    if (k in map && map[k] < it.o.length && !quiz.answers[it.id]){ e.preventDefault(); select(map[k], "pick"); }
    else if ((e.key === "Enter" || e.key === "ArrowRight") && quiz.answers[it.id]){
      if (ae && ae.tagName === "SUMMARY") return;
      e.preventDefault(); next();
    }
  } else if (view === "cards" && deck && deck.i < deck.cards.length){
    if (e.key === " " || e.key === "Enter"){
      if (ae && ae.tagName === "BUTTON") return;
      e.preventDefault(); deck.flipped = !deck.flipped; renderCards();
      const fc = document.querySelector(".fcard"); if (fc) fc.focus();
    }
    else if (e.key === "ArrowRight") knowCard();
    else if (e.key === "ArrowLeft"){ deck.again.push(deck.cards[deck.i]); advanceCard(); }
  }
});

applyTheme();
applyLang();
renderHome();
</script>
</body>
</html>
